kind = "web"
previewPath = "/"
title = "Bangladeshi Student in South Korea"
version = "1.0.0"
id = "artifacts/student-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22167

[services.development]
run = "pnpm --filter @workspace/student-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-site", "run", "build" ]
publicDir = "artifacts/student-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22167"
BASE_PATH = "/"
